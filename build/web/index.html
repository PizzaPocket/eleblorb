<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Eleblorb</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #090e13;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}


:root {
	--eleblorb-ui-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
	--eleblorb-vv-left: 0px;
	--eleblorb-vv-top: 0px;
	--eleblorb-vv-width: 100vw;
	--eleblorb-vv-height: 100vh;
}

#canvas, #status {
	position: fixed !important;
	left: var(--eleblorb-vv-left) !important;
	top: var(--eleblorb-vv-top) !important;
	right: auto !important;
	bottom: auto !important;
	width: var(--eleblorb-vv-width) !important;
	height: var(--eleblorb-vv-height) !important;
}

#status {
	box-sizing: border-box;
	background: #090e13;
	color: #f7edd9;
	font-family: var(--eleblorb-ui-font);
	padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
	z-index: 2147482999;
	opacity: 1;
	transition: opacity 350ms cubic-bezier(.22, 1, .36, 1);
}

#status.eleblorb-ready { opacity: 0; }

#loading-content {
	display: flex;
	width: min(780px, calc(100vw - 48px));
	flex-direction: column;
	align-items: stretch;
	gap: 24px;
	text-align: center;
}

#loading-title {
	margin: 0;
	font: 700 clamp(38px, 7vw, 72px)/1 var(--eleblorb-ui-font);
	letter-spacing: -.03em;
}

#loading-controls {
	display: none;
	min-height: 132px;
	align-items: center;
	justify-content: center;
}

.loader-desktop { display: flex; gap: clamp(24px, 6vw, 60px); }
.loader-mobile, .loader-controller { display: none; }
.loader-control { display: flex; min-width: 150px; flex-direction: column; align-items: center; gap: 12px; }
.loader-copy { color: #ccbaa0; font-size: 16px; line-height: 1.35; }
.keys { display: flex; align-items: center; gap: 6px; }
.key, .mouse {
	display: grid;
	box-sizing: border-box;
	place-items: center;
	border: 2px solid rgba(255,255,255,.85);
	background: rgba(99,51,61,.88);
	color: #f7edd9;
}
.key { width: 38px; height: 38px; border-radius: 12px; font-size: 14px; }
.key.wide { width: 112px; }
.mouse { width: 42px; height: 62px; border-radius: 20px; }
.mouse::before { content: ''; width: 3px; height: 13px; margin-top: -18px; border-radius: 2px; background: #f7edd9; }
.joystick {
	position: relative;
	width: 116px;
	height: 116px;
	box-sizing: border-box;
	border: 7px solid rgba(247,237,217,.32);
	border-radius: 38px;
}
.joystick::after {
	content: '';
	position: absolute;
	top: 50%; left: 50%;
	width: 50px; height: 50px;
	border-radius: 17px;
	background: rgba(247,237,217,.9);
	animation: eleblorb-joystick 5.2s ease-in-out infinite;
}
@keyframes eleblorb-joystick {
	0%, 50%, 100% { transform: translate(-50%, -50%); }
	12.5% { transform: translate(calc(-50% - 12px), calc(-50% - 9px)); }
	25% { transform: translate(-50%, -50%); }
	37.5% { transform: translate(calc(-50% + 12px), calc(-50% + 9px)); }
}

#loading-tip {
	box-sizing: border-box;
	min-height: 74px;
	margin: 0;
	padding: 18px 24px;
	border-radius: 28px;
	background: rgba(41,28,18,.55);
	color: #ccbaa0;
	font-size: 16px;
	line-height: 1.45;
	display: grid;
	place-items: center;
}

#status-phase { color: #ccbaa0; font-size: 14px; line-height: 1.2; }
#status-progress {
	appearance: none;
	-webkit-appearance: none;
	position: static;
	width: 100%;
	height: 12px;
	margin: 0;
	border: 0;
	border-radius: 999px;
	background: rgba(204,186,160,.24);
	overflow: hidden;
}
#status-progress::-webkit-progress-bar { background: rgba(204,186,160,.24); }
#status-progress::-webkit-progress-value { background: #d78698; border-radius: 999px; }
#status-progress::-moz-progress-bar { background: #d78698; border-radius: 999px; }

body.gamepad-connected .loader-desktop { display: none; }
body.gamepad-connected .loader-controller { display: flex; }

@media (max-width: 700px) {
	#loading-content { gap: 18px; }
	#loading-controls { min-height: 156px; }
	.loader-desktop { flex-wrap: wrap; gap: 16px; }
	.loader-control { min-width: 96px; }
	#loading-tip { min-height: 86px; padding: 16px 18px; }
}

@media (hover: none) and (pointer: coarse) {
	.loader-desktop { display: none; }
	.loader-mobile { display: flex; flex-direction: column; align-items: center; gap: 16px; }
	body.gamepad-connected .loader-mobile { display: none; }
	body.gamepad-connected .loader-controller { display: flex; }
}

@media (prefers-reduced-motion: reduce) {
	.joystick::after { animation: none; transform: translate(-50%, -50%); }
	#status { transition-duration: 1ms; }
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="loading-content">
				<h1 id="loading-title">Eleblorb</h1>
				<div id="loading-controls" aria-label="Controls">
					<div class="loader-desktop">
						<div class="loader-control"><div class="keys" aria-hidden="true"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></div><span class="loader-copy">Move</span></div>
						<div class="loader-control"><div class="mouse" aria-hidden="true"></div><span class="loader-copy">Look around</span></div>
						<div class="loader-control"><div class="key wide" aria-hidden="true">SPACE</div><span class="loader-copy">Jump</span></div>
					</div>
					<div class="loader-controller"><span class="loader-copy">Left Stick to move · Right Stick to look · Y to jump</span></div>
					<div class="loader-mobile"><div class="joystick" aria-hidden="true"></div><span class="loader-copy">Drag to move · Drag the world to look</span></div>
				</div>
				<p id="loading-tip">Press F near people, objects, and Blorbs to interact.</p>
				<div id="status-phase" role="status" aria-live="polite">Preparing Eleblorb…</div>
				<progress id="status-progress" max="1" value="0" aria-label="Loading progress"></progress>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3732684,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusPhase = document.getElementById('status-phase');
	const loadingControls = document.getElementById('loading-controls');
	const loadingTip = document.getElementById('loading-tip');

	const desktopTips = [
		'Press F near people, objects, and Blorbs to interact.',
		'Press Tab to open Items, Blorbs, and your Character.',
		'Press T to toggle your Blorb suit.',
		'Bounce off a Blorb and jump as you land to leap higher.',
		'A compass can point you toward wild Blorbs.'
	];
	const touchTips = [
		'Tap an action when you are close enough to interact.',
		'Open your inventory to see Items, Blorbs, and your Character.',
		'Use the Blorb suit action to wear your party Blorbs.',
		'Bounce off a Blorb and jump as you land to leap higher.',
		'A compass can point you toward wild Blorbs.'
	];
	let tipIndex = 0;
	const touchPrimary = window.matchMedia('(hover: none) and (pointer: coarse)');
	setInterval(() => {
		const tips = touchPrimary.matches ? touchTips : desktopTips;
		tipIndex = (tipIndex + 1) % tips.length;
		loadingTip.textContent = tips[tipIndex];
	}, 3200);

	window.addEventListener('gamepadconnected', () => document.body.classList.add('gamepad-connected'));
	window.addEventListener('gamepaddisconnected', () => document.body.classList.remove('gamepad-connected'));

	function syncVisibleViewport(notifyGodot) {
		const viewport = window.visualViewport;
		const left = viewport ? viewport.pageLeft : (window.scrollX || 0);
		const top = viewport ? viewport.pageTop : (window.scrollY || 0);
		const width = viewport ? viewport.width : window.innerWidth;
		const height = viewport ? viewport.height : window.innerHeight;
		const style = document.documentElement.style;
		style.setProperty('--eleblorb-vv-left', left + 'px');
		style.setProperty('--eleblorb-vv-top', top + 'px');
		style.setProperty('--eleblorb-vv-width', width + 'px');
		style.setProperty('--eleblorb-vv-height', height + 'px');
		if (notifyGodot) requestAnimationFrame(() => window.dispatchEvent(new Event('resize')));
	}
	syncVisibleViewport(false);
	window.addEventListener('resize', () => syncVisibleViewport(false));
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', () => syncVisibleViewport(true));
		window.visualViewport.addEventListener('scroll', () => syncVisibleViewport(false));
	}

	window.eleblorbLoadingPhase = function (text, progress) {
		statusPhase.textContent = text;
		if (Number.isFinite(progress)) {
			statusProgress.max = 1;
			statusProgress.value = Math.max(0, Math.min(1, progress));
		}
	};
	window.eleblorbWorldReady = function () {
		window.eleblorbLoadingPhase('Ready', 1);
		requestAnimationFrame(() => requestAnimationFrame(() => {
			statusOverlay.classList.add('eleblorb-ready');
			setTimeout(() => {
				statusOverlay.remove();
				initializing = false;
				document.getElementById('canvas').focus();
			}, 350);
		}));
	};

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusPhase.style.display = mode === 'progress' ? 'block' : 'none';
		loadingControls.style.display = mode === 'progress' ? 'flex' : 'none';
		loadingTip.style.display = mode === 'progress' ? 'grid' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const ratio = Math.min(current / total, 1);
					window.eleblorbLoadingPhase(ratio >= 1 ? 'Starting Eleblorb…' : 'Downloading Eleblorb…', ratio * 0.9);
				} else {
					statusProgress.removeAttribute('value');
					statusPhase.textContent = 'Preparing Eleblorb…';
				}
			},
		}).then(() => {
			window.eleblorbLoadingPhase('Building the world…', 0.92);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
